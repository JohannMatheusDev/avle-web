<!doctype html><html lang="pt-BR" class="avle-ds"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVLE · Minha conta</title>
<link rel="stylesheet" href="../../styles.css">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('avle-theme')||'dark')</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../runtime/ds-bundle.js"></script>
<script type="text/babel" src="../shared/AppShell.jsx"></script>
<script type="text/babel" src="CustomerHome.jsx"></script>
<script type="text/babel" src="CustomerOrders.jsx"></script>
<script type="text/babel" src="CustomerMore.jsx"></script>
</head><body><div id="root"></div>
<script type="text/babel">

const NAV=[{value:'inicio',label:'Início',icon:'house'},{value:'pedidos',label:'Pedidos',icon:'package'},{value:'favoritos',label:'Favoritos',icon:'heart'},{value:'conta',label:'Conta',icon:'user'}];
function App(){
  const [theme,setTheme]=useTheme();
  const [page,setPageRaw]=React.useState(()=>localStorage.getItem('avle-cliente-page')||'inicio');
  const setPage=(p)=>{setPageRaw(p);localStorage.setItem('avle-cliente-page',p);};
  const [toast,toastNode]=useToast();
  const P={inicio:CustomerHome,pedidos:CustomerOrders,favoritos:CustomerFavorites,conta:CustomerAccount}[page]||CustomerHome;
  return <AppShell role="Cliente" nav={NAV} page={page} setPage={setPage} user="Lucas Andrade" theme={theme} setTheme={setTheme}><P go={setPage} toast={toast}/>{toastNode}</AppShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
