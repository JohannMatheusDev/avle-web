<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Positive reuses Sprout; negative red; warning amber; info blue" -->
<!doctype html><html class="avle-ds"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--bg-app)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;height:104px;border-radius:20px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;font-size:12px;box-shadow:inset 0 0 0 1px var(--border-subtle)}.sw b{font-weight:600;font-size:13px}.sw span{opacity:.75;font-family:var(--font-mono);font-size:11px}.k{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}</style></head><body><div class="row"><div class="sw" style="background:var(--positive-soft);color:var(--positive)"><b>Positive</b><span>var(--positive)</span></div><div class="sw" style="background:var(--negative-soft);color:var(--negative)"><b>Negative</b><span>#FF5A5A</span></div><div class="sw" style="background:var(--warning-soft);color:var(--warning)"><b>Warning</b><span>#F5B94A</span></div><div class="sw" style="background:var(--info-soft);color:var(--info)"><b>Info</b><span>#7AB8FF</span></div></div></body></html>
