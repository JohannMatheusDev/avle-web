<!doctype html><html class="avle-ds"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--bg-app)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;height:104px;border-radius:20px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;font-size:12px;box-shadow:inset 0 0 0 1px var(--border-subtle)}.sw b{font-weight:600;font-size:13px}.sw span{opacity:.75;font-family:var(--font-mono);font-size:11px}.k{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}</style></head><body><div class="row"><div class="sw" style="background:var(--avle-forest);color:#F8F4EC"><b>Forest</b><span>#1E3A2F</span></div><div class="sw" style="background:var(--avle-forest-500);color:#F8F4EC"><b>Forest 500</b><span>#2D5443</span></div><div class="sw" style="background:var(--avle-forest-300);color:#FCFCFC"><b>Forest 300</b><span>#5F8A74</span></div><div class="sw" style="background:var(--avle-cream);color:#1E3A2F"><b>Cream</b><span>#F8F4EC</span></div><div class="sw" style="background:var(--avle-cream-400);color:#1E3A2F"><b>Cream 400</b><span>#D9CFBB</span></div></div></body></html>
