<!doctype html><html class="avle-ds"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--bg-app)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;height:104px;border-radius:20px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;font-size:12px;box-shadow:inset 0 0 0 1px var(--border-subtle)}.sw b{font-weight:600;font-size:13px}.sw span{opacity:.75;font-family:var(--font-mono);font-size:11px}.k{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}</style></head><body><div class="row"><div class="sw" style="background:var(--avle-sprout);color:#0E1A08"><b>Sprout</b><span>#CBEF7E</span></div><div class="sw" style="background:var(--accent-hover);color:#0E1A08"><b>Hover</b><span>#D8F59A</span></div><div class="sw" style="background:var(--avle-sprout-600);color:#0E1A08"><b>Press</b><span>#A9D457</span></div><div class="sw" style="background:var(--avle-sprout-800);color:#FCFCFC"><b>Deep</b><span>#5E7A2C</span></div><div class="sw" style="background:var(--accent-soft);color:var(--avle-sprout)"><b>Soft 14%</b><span>rgba(203,239,126,.14)</span></div></div></body></html>
