<!-- @dsCard group="Colors" viewport="700x150" name="Light theme" subtitle="[data-theme=light] — cream canvas, forest accent" -->
<!doctype html><html class="avle-ds" data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--bg-app)}.row{display:flex;gap:12px}.sw{flex:1;height:104px;border-radius:20px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;font-size:12px;box-shadow:inset 0 0 0 1px var(--border-default)}.sw b{font-size:13px}.sw span{font-family:var(--font-mono);font-size:11px;opacity:.7}</style></head><body><div class="row">
<div class="sw" style="background:var(--bg-app)"><b>App bg</b><span>#F2EFE8</span></div><div class="sw" style="background:var(--surface-card)"><b>Card</b><span>#FFFFFF</span></div><div class="sw" style="background:var(--surface-raised)"><b>Raised</b><span>#F8F4EC</span></div><div class="sw" style="background:var(--accent);color:var(--avle-cream)"><b>Accent</b><span>Forest</span></div><div class="sw" style="background:var(--text-primary);color:#fff"><b>Text</b><span>#0A0A0A</span></div></div></body></html>
