<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head><body><div id="root"></div><script type="text/babel">
const NS=window.AVLEDesignSystem_11270f;

const {Input,Select,Checkbox,Radio,Switch,Segmented}=NS;
function App(){const [c,sc]=React.useState(true);const [r,sr]=React.useState('pac');const [s,ss]=React.useState(true);const [t,st]=React.useState('dark');const [p,sp]=React.useState('Semana');
return <div className="c">
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}><Input label="E-mail" placeholder="voce@loja.com" icon="mail"/><Input label="CEP" defaultValue="0123" error="CEP incompleto"/></div>

<div className="r"><Segmented options={[{value:'light',label:'Claro',icon:'sun'},{value:'dark',label:'Escuro',icon:'moon'}]} value={t} onChange={st}/><Segmented size="sm" options={['Dia','Semana','Mês']} value={p} onChange={sp}/></div>
</div>}
